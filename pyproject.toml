[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-hidro-anuga"
version = "0.1.0"
description = "Linux-first ANUGA runner for transparent, user-specified flood-routing scenarios"
requires-python = ">=3.11"
dependencies = ["anuga>=4.0", "shapely>=2.0", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
simulador-hidro = "jurumirim_sim.cli:main"
simulador-animar = "jurumirim_sim.animate:main"

[tool.setuptools.packages.find]
where = ["src"]

